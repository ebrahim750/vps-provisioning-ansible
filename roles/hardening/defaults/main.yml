---
# Role-scoped knobs. ansible-lint requires role defaults to carry the role name
# as a prefix. deploy_user and deploy_ssh_keys are inventory variables defined in
# group_vars/vps.yml, so they are not redeclared here.
hardening_deploy_user_shell: /bin/bash
hardening_deploy_user_sudo_nopasswd: true

hardening_fail2ban_maxretry: 5
hardening_fail2ban_bantime: 1h
hardening_fail2ban_findtime: 10m

hardening_sysctl:
  # Kernel information leaks
  kernel.dmesg_restrict: 1
  kernel.kptr_restrict: 2
  kernel.yama.ptrace_scope: 1
  # Network stack
  net.ipv4.conf.all.rp_filter: 1
  net.ipv4.conf.default.rp_filter: 1
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.default.accept_redirects: 0
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.all.accept_source_route: 0
  net.ipv4.conf.all.log_martians: 1
  net.ipv4.tcp_syncookies: 1
  net.ipv6.conf.all.accept_redirects: 0
  net.ipv6.conf.all.accept_source_route: 0
  # Keep forwarding available: Docker needs it.
  net.ipv4.ip_forward: 0
